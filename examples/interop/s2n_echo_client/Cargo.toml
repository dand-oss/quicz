[package]
name = "quicz-s2n-echo-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# rustls provider: s2n-tls (the default) may not offer X25519 on macOS,
# and the quicz TLS 1.3 stack only supports X25519 key shares.
s2n-quic = { version = "1.85", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
bytes = "1"
